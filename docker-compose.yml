name: hackathon

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - default
      - sandbox_net
    restart: unless-stopped
    environment:
      - LLM_API_KEY=${LLM_API_KEY}

  sandbox:
    build: ./sandbox
    networks:
      - sandbox_net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

networks:
  sandbox_net:
    internal: true
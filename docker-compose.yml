name: hackathon

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://127.0.0.1:8000}
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:8000:8000"
    networks:
      - default
      - sandbox_net
    restart: unless-stopped
    environment:
      - APIFY_TOKEN=${APIFY_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  sandbox:
    build: ./sandbox
    networks:
      - sandbox_net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

networks:
  sandbox_net:
    internal: true

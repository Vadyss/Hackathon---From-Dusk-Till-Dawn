name: hackathon

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    networks:
      - default
      - sandbox_net
    restart: unless-stopped
    environment:
      - APIFY_TOKEN=${APIFY_TOKEN}

  sandbox:
    build: ./sandbox
    networks:
      - sandbox_net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

networks:
  sandbox_net:
    internal: true
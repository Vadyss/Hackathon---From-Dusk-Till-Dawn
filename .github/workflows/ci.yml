name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up --build -d
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE || 'http://127.0.0.1:8000' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:3000,http://127.0.0.1:3000' }}
          BACKEND_BIND_HOST: ${{ vars.BACKEND_BIND_HOST || '127.0.0.1' }}

      - name: Backend health check
        run: curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8000/health

      - name: Frontend health check
        run: curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000

      - name: Sandbox security checks
        run: |
          if docker exec hackathon-sandbox-1 printenv APIFY_TOKEN > /dev/null; then
            echo "FAIL: sandbox has API key"; exit 1
          fi
          if docker exec hackathon-sandbox-1 python -c "import urllib.request; urllib.request.urlopen('http://1.1.1.1', timeout=5)" > /dev/null 2>&1; then
            echo "FAIL: sandbox has internet access"; exit 1
          fi
          if docker exec hackathon-sandbox-1 touch /app/test > /dev/null 2>&1; then
            echo "FAIL: sandbox filesystem is writable"; exit 1
          fi
          echo "All sandbox security checks passed"
